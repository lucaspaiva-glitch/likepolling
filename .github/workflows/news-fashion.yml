name: Fashion News

on:
  schedule:
    - cron: '30 0,12 * * *' # twice a day, after World News
  workflow_dispatch:

concurrency:
  group: news-fashion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies (Gemini SDK)
        run: npm ci --omit=dev
      - name: Refresh news_fashion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/news-fashion-routine.js
