name: Sample PDFs

on:
  schedule:
    - cron: '47 6 * * 1' # Mondays, after the report ideas
  workflow_dispatch:

concurrency:
  group: sample-pdfs
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Print the free samples in every language and upload them to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: scripts/sample-pdfs.sh https://www.likepolling.com google-chrome
