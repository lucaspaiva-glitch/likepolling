name: Fashion chart check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fashion-check.js]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fashion-check.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
