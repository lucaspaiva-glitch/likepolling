name: Translate site UI

on:
  push:
    branches: ['devin/**']
    paths: ['scripts/translate-ui.js']

concurrency:
  group: translate-ui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies (Gemini SDK)
        run: npm ci --omit=dev
      - name: Fill new languages into assets/i18n.js and assets/report-i18n.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate-ui.js
      - name: Commit the translations to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js assets/report-i18n.js
          git diff --cached --quiet || (git commit -m "Translate site UI into French, Chinese and Hindi" && git push)
