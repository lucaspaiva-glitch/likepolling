name: YouTube Trending Index

on:
  schedule:
    - cron: '17 * * * *' # hourly; off the top of the hour, when GitHub's scheduler is busiest
  workflow_dispatch:

concurrency:
  group: youtube-trending
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Refresh youtube_trending
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/trending-routine.js
