name: YouTube Music Index

on:
  schedule:
    - cron: '37 * * * *' # hourly, offset from the Trending Index run at :17
  workflow_dispatch:

concurrency:
  group: youtube-music-chart
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Refresh youtube_music_chart
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/music-chart-routine.js
