name: News mentions memory

on:
  schedule:
    - cron: '41 4 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/news-mentions-routine.js']

concurrency:
  group: news-mentions-memory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Save daily news articles and tone per person or brand
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/news-mentions-routine.js
