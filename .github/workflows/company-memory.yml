name: Company memory

on:
  schedule:
    - cron: '23 6 * * 2' # Tuesdays
  workflow_dispatch:

concurrency:
  group: company-memory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Save yearly sales and profit of SEC-filing companies
        run: node scripts/sec-routine.js
