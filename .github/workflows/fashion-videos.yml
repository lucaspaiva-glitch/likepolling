name: Fashion Videos

on:
  schedule:
    - cron: '47 0,12 * * *' # twice a day (UTC), off the top of the hour
  workflow_dispatch:

concurrency:
  group: fashion-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Refresh fashion_videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/fashion-videos-routine.js
