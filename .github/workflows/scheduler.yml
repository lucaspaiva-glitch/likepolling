name: Scheduled Intelligence Harvester

on:
  schedule:
    # Runs automatically during Lisbon business hours
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # This line enables the manual "Run workflow" button!

jobs:
  run-harvester:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install supabase google-generativeai feedparser

      - name: Execute Harvester Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py
