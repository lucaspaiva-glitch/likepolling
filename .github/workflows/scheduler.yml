name: Scheduled Intelligence Harvester

on:
  schedule:
    # Runs daily, every day of the week (no business-hours gating)
    - cron: '0 9 * * *'
  workflow_dispatch: # This line enables the manual "Run workflow" button!

jobs:
  run-harvester:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install supabase feedparser

      - name: Execute Harvester Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py
