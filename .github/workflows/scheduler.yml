name: Like Polling Truth Engine

on:
  schedule:
    # Runs hourly Monday through Friday from 08:00 to 16:00 UTC (09:00 to 17:00 Lisbon PRT)
    - cron: '0 8-16 * * 1-5'
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase

      - name: Execute Background Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python worker.py
