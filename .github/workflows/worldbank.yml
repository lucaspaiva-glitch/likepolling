name: World Bank country numbers

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

concurrency:
  group: worldbank
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: GDP, growth, inflation, unemployment and population per country
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/worldbank-routine.js
