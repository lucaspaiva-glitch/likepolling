name: Education channel check
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'handles or search'
        default: search
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/education-check.js
        env:
          MODE: ${{ inputs.mode }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
