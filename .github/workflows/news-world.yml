name: World News Wire

on:
  schedule:
    # Twice a day (UTC): 00 is morning in East Asia/Australia, 12 is morning in the
    # Americas and midday in Europe, the Middle East and Africa.
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: news-world
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies (Gemini SDK)
        run: npm ci --omit=dev
      - name: Refresh news_world
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/news-world-routine.js
