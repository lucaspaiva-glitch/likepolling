name: World News Wire

on:
  schedule:
    # 4 times a day (UTC), each a morning somewhere in the 41 countries:
    # 00 East Asia/Australia, 06 South Asia/Middle East/Europe/Africa, 12 Americas, 18 evening news Europe/Africa.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: news-world
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies (Gemini SDK)
        run: npm ci --omit=dev
      - name: Refresh news_world
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/news-world-routine.js
