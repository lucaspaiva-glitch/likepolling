<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIKE POLLING // MARKET INTELLIGENCE TERMINAL</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12141c;
      --border: #222634;
      --text-main: #f3f4f6;
      --text-muted: #8b949e;
      --accent-green: #00ff66;
      --accent-red: #ff3344;
      --accent-gold: #ffb800;
      --font-mono: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
    }

    /* TOP MACRO TICKER */
    .ticker-bar {
      display: flex;
      gap: 24px;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 24px;
      align-items: center;
    }
    .ticker-label {
      color: var(--accent-gold);
      font-weight: bold;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    .ticker-item {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .pos { color: var(--accent-green); }
    .neg { color: var(--accent-red); }

    /* HEADER & STATUS */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .terminal-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .status-badge {
      font-size: 11px;
      color: var(--accent-green);
    }

    /* KPI CARDS GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .entity-name { font-size: 15px; font-weight: bold; text-transform: uppercase; }
    .entity-cat {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .metric-label { color: var(--text-muted); }
    .metric-val { font-weight: 600; }
  </style>
</head>
<body>

  <!-- MACRO TICKER -->
  <div class="ticker-bar">
    <span class="ticker-label">TRUTH ENGINE MACRO:</span>
    <div id="macro-tickers">Loading synthetic platform indices...</div>
  </div>

  <div class="header-row">
    <div class="terminal-title">LIKE POLLING // TERMINAL v1.0</div>
    <div class="status-badge">● LISBON OPERATIONAL WINDOW ACTIVE (PRT)</div>
  </div>

  <!-- ENTITY CARDS -->
  <div class="grid" id="entity-grid">
    <div style="color: var(--text-muted);">Synchronizing verified database metrics...</div>
  </div>

  <script>
    // These are your public frontend keys. They are safe to be visible in client code.
    const SUPABASE_URL = "https://iyhaoagsisrtwtkcrxylp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sFCHMhAt6xrlg24bFdxSZQ_oNpZMYk";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTerminalData() {
      // 1. Fetch Dynamic Macro Truth Engine Disclosures
      const { data: disclosures } = await client.from('platform_disclosures').select('*');

      if (disclosures && disclosures.length > 0) {
        const container = document.getElementById('macro-tickers');
        container.innerHTML = disclosures.map(d => {
          const idx = d.bot_percentage ?? d.synthetic_index ?? 0;
          const delta = d.delta ?? 0;
          const deltaClass = delta >= 0 ? 'pos' : 'neg';
          const symbol = delta >= 0 ? '▲' : '▼';
          return `
            <span class="ticker-item" style="margin-right: 18px;">
              <strong>${d.platform.toUpperCase()} SYNTHETIC INDEX:</strong>
              <span>${Number(idx).toFixed(1)}%</span>
              <span class="${deltaClass}">[${symbol} ${Math.abs(delta).toFixed(1)}%]</span>
            </span>
          `;
        }).join('');
      }

      // 2. Fetch Entities and Their Most Recent Metrics
      const { data: entities } = await client.from('entities').select('*');
      const { data: metrics } = await client.from('entity_metrics').select('*').order('metric_date', { ascending: false });

      if (entities && entities.length > 0) {
        const grid = document.getElementById('entity-grid');
        grid.innerHTML = entities.map(entity => {
          // Match entity metrics using either id or slug
          const entityMetric = metrics ? metrics.find(m => (m.entity_slug === entity.id || m.entity_slug === entity.slug || m.entity_id === entity.id)) : null;
          
          const primaryLabel = entity.category === 'lives' ? 'Peak Concurrent CCV' : 'Latest Upload Reach';
          const engagementLabel = entity.category === 'lives' ? 'Chat Velocity / min' : 'Verified Engagement';

          const primaryVal = entityMetric ? Number(entityMetric.primary_volume).toLocaleString() : 'Pending Sync';
          const engagementVal = entityMetric ? Number(entityMetric.engagement_volume ?? entityMetric.comment_volume ?? 0).toLocaleString() : 'Pending Sync';

          return `
            <div class="card">
              <div class="card-header">
                <span class="entity-name">${entity.name}</span>
                <span class="entity-cat">${entity.category}</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">${primaryLabel}:</span>
                <span class="metric-val">${primaryVal}</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">${engagementLabel}:</span>
                <span class="metric-val">${engagementVal}</span>
              </div>
              <div class="metric-row" style="margin-top: 12px; font-size: 11px;">
                <span class="metric-label">Status:</span>
                <span style="color: var(--accent-green);">AUDITED &amp; VERIFIED</span>
              </div>
            </div>
          `;
        }).join('');
      } else {
         document.getElementById('entity-grid').innerHTML = '<div style="color: var(--text-muted);">Database connected. Awaiting next entity data harvest...</div>';
      }
    }

    loadTerminalData();
  </script>
</body>
</html>
