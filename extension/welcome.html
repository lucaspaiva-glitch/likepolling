<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creators +</title>
  <style>
    @font-face { font-family: 'CP Inter'; src: url(fonts/inter-var-latin.woff2) format('woff2'); font-weight: 100 900; }
    :root { --red: #b0000e; --red-soft: #fbf1f1; --ink: #0d0d0d; --mute: #6b6b6b; --line: #ebebeb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #fff, var(--red-soft)); font: 15px/1.5 'CP Inter', system-ui, sans-serif; color: var(--ink); }
    main { width: min(360px, calc(100vw - 32px)); background: #fff; border: 1px solid #ecd2d2; border-radius: 16px; padding: 22px; box-shadow: 0 20px 50px rgba(60,0,6,.12); text-align: center; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 18px; }
    .brand svg { width: 30px; height: 30px; }
    .brand i { font-style: normal; color: var(--red); }
    h1 { font-size: 20px; line-height: 1.2; margin: 12px 0 6px; letter-spacing: -.02em; }
    p { margin: 0 0 14px; font-size: 13px; color: var(--mute); }
    a.go { display: block; font-weight: 800; color: #fff; background: var(--red); border-radius: 999px; padding: 11px; text-decoration: none; }
    a.go:hover { background: #8f000b; }
    a.alt { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--red); text-decoration: none; }
    .privacy { margin: 14px 0 0; font-size: 11px; color: var(--mute); }
    .privacy a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#b0000e"/><polyline points="5,21 8,19 10.5,20.2 13.5,16.5 15.5,17.6 18.5,12.5 20.5,13.6 23,6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="6" r="1.9" fill="#fff"/></svg>Creators <i>+</i></div>
    <h1 data-t="w_title"></h1>
    <p data-t="w_where"></p>
    <a class="go" id="try" href="https://www.youtube.com/watch?v=plN7JMbadRg" data-t="w_try"></a>
    <a class="alt" id="yt" href="https://www.youtube.com/"><span data-t="open_yt"></span> ↗</a>
    <p class="privacy"><span data-t="w_change"></span> <a href="https://www.likepolling.com/privacy" target="_blank" rel="noopener">likepolling.com/privacy</a></p>
  </main>
  <script src="config.js"></script>
  <script src="lib/core.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
