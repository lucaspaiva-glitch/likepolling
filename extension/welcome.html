<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creators +</title>
  <style>
    @font-face { font-family: 'CP Inter'; src: url(fonts/inter-var-latin.woff2) format('woff2'); font-weight: 100 900; }
    :root { --red: #b0000e; --red-soft: #fbf1f1; --ink: #0d0d0d; --mute: #6b6b6b; --line: #ebebeb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #fff, var(--red-soft)); font: 15px/1.5 'CP Inter', system-ui, sans-serif; color: var(--ink); }
    main { width: min(480px, calc(100vw - 32px)); background: #fff; border: 1px solid #ecd2d2; border-radius: 18px; padding: 32px; box-shadow: 0 24px 60px rgba(60,0,6,.12); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
    .brand svg { width: 34px; height: 34px; }
    .brand i { font-style: normal; color: var(--red); }
    h1 { font-size: 26px; line-height: 1.15; margin: 20px 0 6px; letter-spacing: -.02em; }
    p { margin: 0 0 18px; color: var(--mute); }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .meta { font-size: 13px; color: var(--mute); margin: 10px 0 22px; }
    button { width: 100%; font: inherit; font-weight: 800; color: #fff; background: var(--red); border: 0; border-radius: 999px; padding: 12px; cursor: pointer; }
    .tip, .privacy { font-size: 13px; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--red-soft); color: var(--ink); }
    .privacy { background: #f6f6f6; color: var(--mute); }
    .where { margin: 0 0 16px; font-weight: 600; }
    .done { display: none; text-align: center; font-weight: 700; color: #0a8f4a; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#b0000e"/><polyline points="5,21 8,19 10.5,20.2 13.5,16.5 15.5,17.6 18.5,12.5 20.5,13.6 23,6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="6" r="1.9" fill="#fff"/></svg>Creators <i>+</i></div>
    <h1 data-t="w_title"></h1>
    <p data-t="w_sub"></p>
    <label for="country" data-t="w_q"></label>
    <select id="country"></select>
    <div class="meta"><span id="lang"></span> · <span data-t="w_noacct"></span></div>
    <div class="tip where" data-t="w_where"></div>
    <button id="start" data-t="w_start"></button>
    <div class="done" id="done" data-t="w_done"></div>
    <div class="tip" data-t="w_pin"></div>
    <div class="privacy"><span data-t="w_privacy"></span> <a href="https://www.likepolling.com/privacy" target="_blank" rel="noopener">likepolling.com/privacy</a></div>
  </main>
  <script src="config.js"></script>
  <script src="lib/core.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
